  zh: "shared_evidence 文件不包含 PII（只有公开法律条文）。Event-taint 为空，因此 SAGE 允许。Context-only baseline 看到与 danger pair 相同的 O_ctx，必须同时拒绝两者（碰撞）。这证明了通过共享文件的跨 Agent 污点传播被 event-taint 正确追踪，但对 context-only 观察不可见。"