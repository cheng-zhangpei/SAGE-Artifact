  zh: "publish=false 意味着 Wr(u)={internal_build_log}。Q_B(u)=∅，因为 internal_build_log 没有禁止标签。即使 Gen(u)={UNVERIFIED}，eta ∩ Q_B = ∅。SAGE 允许。这不是严格意义上的 O_ctx collision case（参数不同），但它证明了 SAGE 避免了朴素的'如果 UNVERIFIED 就拒绝'规则导致的工具级封杀。"