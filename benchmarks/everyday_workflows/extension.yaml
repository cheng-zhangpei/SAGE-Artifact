    policy: {"slot:research": [POSITION], "slot:sales": [MNPI]}
    actions:
      earnings: [analyst, collect, {source: earnings}, ["slot:earnings"], ["slot:notes"], [], 将未公开财报追加共享笔记。]
      positions: [advisor, collect, {source: positions}, ["slot:positions"], ["slot:notes"], [], 将客户持仓追加共享笔记。]
      summarize: [editor, summarize, {}, ["slot:notes"], ["slot:digest"], [], 整理笔记为摘要，保留来源限制。]
      research: [publisher, send, {target: research}, ["slot:digest"], ["slot:research"], [], 将完整摘要发研究订阅端。]
      sales: [publisher, send, {target: sales}, ["slot:digest"], ["slot:sales"], [], 将完整摘要发销售终端。]
      compliance: [publisher, send, {target: compliance}, ["slot:digest"], ["slot:compliance"], [], 将完整摘要发授权合规室。]
    pairs:
      - [[earnings, positions, summarize], research, [earnings, summarize], research, 研究摘要是否混入持仓]
      - [[positions, earnings, summarize], sales, [positions, summarize], sales, 销售摘要是否混入财报]
      - [[earnings, summarize], sales, [earnings, summarize], compliance, 财报摘要目标]
      - [[positions, summarize], research, [positions, summarize], compliance, 持仓摘要目标]

  - id: W30
    title: 政务申请的公开进度与原始文件
    mechanism: false_sanitizer_name_and_source_selection
    story: 政务窗口将居民申请汇入办理包。format_public只调整页边距和文件名，不删内容，不构成脱敏。审批端允许身份资料，公开进度页不允许。独立进度文字可直接发布。
    labels: {PII: 居民申请身份资料}
    initial_state: {"slot:application": [PII]}
    policy: {"slot:public": [PII]}
    actions:
      collect: [clerk, collect, {}, ["slot:application"], ["slot:packet"], [], 将原始申请追加办理包。]
      format: [formatter, format_public, {}, ["slot:packet"], ["slot:formatted"], [], 调整页边距和文件名，不删除字段。]
      public: [portal, upload, {source: formatted, target: public}, ["slot:formatted"], ["slot:public"], [], 将格式化文件发布公开进度页。]
      approval: [portal, upload, {source: formatted, target: approval}, ["slot:formatted"], ["slot:approval"], [], 将格式化文件提交授权审批端。]
      status: [portal, upload, {source: status, target: public}, ["slot:status"], ["slot:public"], [], 只读独立进度文字并发布。]
      raw: [portal, upload, {source: packet, target: public}, ["slot:packet"], ["slot:public"], [], 直接发布原始办理包。]
    pairs:
      - [[collect, format], public, [format], public, 格式化材料是否来自申请]
      - [[collect, format], public, [collect, format], approval, 格式化结果目标]
      - [[collect, format], public, [collect, format], status, 文件还是独立进度文字]
      - [[collect], raw, [], raw, 绕过格式化的上传路径]

  - id: W31
    title: 客户关系系统的批量外发
    mechanism: batch_read_union
    story: 客户经理准备甲乙两份提案。每份提案只允许发对应客户，中央档案允许两者。scope=all会读取两个提案并合并，不能只根据to参数假定读取单方。
    labels: {CLIENT_A: 甲客户资料, CLIENT_B: 乙客户资料}
    initial_state: {"slot:source_a": [CLIENT_A], "slot:source_b": [CLIENT_B]}
    policy: {"slot:out_a": [CLIENT_B], "slot:out_b": [CLIENT_A]}
    actions:
      prepare_a: [manager_a, prepare, {}, ["slot:source_a"], ["slot:proposal_a"], [], 将甲资料写入甲提案。]
      prepare_b: [manager_b, prepare, {}, ["slot:source_b"], ["slot:proposal_b"], [], 将乙资料写入乙提案。]
      own_a: [mailer, send, {to: a, scope: own}, ["slot:proposal_a"], ["slot:out_a"], [], 只读甲提案发甲客户。]
      all_a: [mailer, send, {to: a, scope: all}, ["slot:proposal_a", "slot:proposal_b"], ["slot:out_a"], [], 合并两份提案发甲客户。]
      own_b: [mailer, send, {to: b, scope: own}, ["slot:proposal_b"], ["slot:out_b"], [], 只读乙提案发乙客户。]
      all_b: [mailer, send, {to: b, scope: all}, ["slot:proposal_a", "slot:proposal_b"], ["slot:out_b"], [], 合并两份提案发乙客户。]
      archive: [mailer, send, {to: archive, scope: all}, ["slot:proposal_a", "slot:proposal_b"], ["slot:archive"], [], 合并两份提案写内部档案。]
    pairs:
      - [[prepare_a, prepare_b], all_a, [prepare_a, prepare_b], own_a, scope对读取范围的影响]
      - [[prepare_a, prepare_b], all_b, [prepare_a, prepare_b], own_b, scope对乙客户的影响]
      - [[prepare_a, prepare_b], all_a, [prepare_a], all_a, 乙提案是否已有资料]
      - [[prepare_a, prepare_b], all_b, [prepare_a, prepare_b], archive, 客户邮箱还是内部档案]

  - id: W32
    title: 开源安全报告与复现附件
    mechanism: public_body_private_attachment
    story: 研究员维护公开摘要和未公开漏洞利用代码。维护者私有通道允许两者，公开问题库不允许利用代码。include_reproducer会在同次调用读取利用代码，mirror会额外写公开库。
    labels: {EXPLOIT: 未公开漏洞利用代码}
    initial_state: {"slot:exploit": [EXPLOIT]}
    policy: {"slot:issues": [EXPLOIT]}
    actions:
      prepare: [researcher, prepare_summary, {}, ["slot:public_notes"], ["slot:summary"], [], 从公开笔记制作摘要。]
      attach: [researcher, attach_reproducer, {}, ["slot:exploit"], ["slot:summary"], [], 将漏洞代码追加摘要槽。]
      plain: [bot, send_summary, {target: issues, include_reproducer: false}, ["slot:summary"], ["slot:issues"], [], 读取摘要槽全部内容公开；false不移除已有附件。]
      reproduced: [bot, send_summary, {target: issues, include_reproducer: true}, ["slot:summary", "slot:exploit"], ["slot:issues"], [], 读取代码与摘要后公开。]
      private: [bot, send_summary, {target: maintainer, mirror: false}, ["slot:summary", "slot:exploit"], ["slot:maintainer"], [], 将摘要和代码发维护者私有通道。]
      mirrored: [bot, send_summary, {target: maintainer, mirror: true}, ["slot:summary", "slot:exploit"], ["slot:maintainer", "slot:issues"], [], 将摘要和代码同时发私有通道和公开库。]
    pairs:
      - [[prepare], reproduced, [prepare], plain, 是否额外读取漏洞代码]
      - [[prepare], mirrored, [prepare], private, 私有发送是否镜像公开库]
      - [[prepare, attach], plain, [prepare], plain, 摘要是否已有附件]
      - [[attach], plain, [attach], private, 带附件材料接收目标]

  - id: W33
    title: 呼叫中心转写与声纹分析
    mechanism: distinct_forbidden_labels
    story: 呼叫中心保留含客户身份的转写和带声纹的原始音频。文本外包不允许声纹，声学研究不允许身份，内部质检允许两者。join参数决定是否合并两类材料。
    labels: {PII: 客户身份转写, BIOMETRIC: 可识别声纹音频}
    initial_state: {"slot:transcript": [PII], "slot:audio": [BIOMETRIC]}
    policy: {"slot:text_vendor": [BIOMETRIC], "slot:acoustic": [PII]}
    actions:
      text: [quality, export, {target: text_vendor, join: false}, ["slot:transcript"], ["slot:text_vendor"], [], 只发送身份转写。]
      text_join: [quality, export, {target: text_vendor, join: true}, ["slot:transcript", "slot:audio"], ["slot:text_vendor"], [], 合并转写和音频发送文本外包。]
      audio: [quality, export, {target: acoustic, join: false}, ["slot:audio"], ["slot:acoustic"], [], 只发送原始音频。]
      audio_join: [quality, export, {target: acoustic, join: true}, ["slot:audio", "slot:transcript"], ["slot:acoustic"], [], 合并音频和转写发送声学研究。]
      internal: [quality, export, {target: internal, join: true}, ["slot:audio", "slot:transcript"], ["slot:internal"], [], 合并两类材料发送内部质检。]
      dual: [quality, export, {target: both, join: true}, ["slot:audio", "slot:transcript"], ["slot:text_vendor", "slot:acoustic"], [], 合并材料同时发两个外部端点。]
    pairs:
      - [[], text_join, [], text, 文本外包是否附带音频]
      - [[], audio_join, [], audio, 声学端是否附带身份]
      - [[], dual, [], internal, 外部双端还是内部质检]
      - [[], audio_join, [], text, 不同外部端点的授权边界]

  - id: W34
    title: 游戏申诉与检测规则保密
    mechanism: derived_confidentiality
    story: 申诉证据包含玩家身份和未公开反作弊规则。安全团队允许两者，玩家回信不允许规则，公开公告不允许身份或规则。解释工具只是改写证据，不会解除规则保密。
    labels: {PII: 玩家身份, DETECTION_RULE: 未公开检测规则}
    initial_state: {"slot:player": [PII], "slot:rules": [DETECTION_RULE]}
    policy: {"slot:reply": [DETECTION_RULE], "slot:notice": [PII, DETECTION_RULE]}
    actions:
      player: [support, collect, {part: player}, ["slot:player"], ["slot:evidence"], [], 将玩家身份追加申诉证据。]
      rules: [security, collect, {part: rules}, ["slot:rules"], ["slot:evidence"], [], 将检测规则追加申诉证据。]
      explain: [writer, explain, {}, ["slot:evidence"], ["slot:explanation"], [], 改写证据生成解释并保留来源限制。]
      reply: [support, send, {target: player}, ["slot:explanation"], ["slot:reply"], [], 将完整解释发送玩家。]
      notice: [support, send, {target: notice}, ["slot:explanation"], ["slot:notice"], [], 将完整解释发布公告。]
      internal: [support, send, {target: security}, ["slot:explanation"], ["slot:internal"], [], 将解释送授权安全团队。]
    pairs:
      - [[player, rules, explain], reply, [player, explain], reply, 回信是否含规则]
      - [[player, explain], notice, [player, explain], reply, 身份解释的接收者]
      - [[rules, explain], reply, [rules, explain], internal, 规则解释目标]
      - [[player, rules, explain], notice, [explain], notice, 公告是否基于受限证据]

  - id: W35
    title: 农业设备维修指令导入
    mechanism: integrity_cache_reuse
    story: 维修助手将论坛未验证指令和厂家已核验手册追加缓存。生产控制禁止未验证指令，离线演练允许。追加手册不会认证或替换论坛指令，另有只读取手册的直接路径。
    labels: {UNVERIFIED: 未验证维修指令}
    initial_state: {"slot:forum": [UNVERIFIED]}
    policy: {"slot:machine": [UNVERIFIED]}
    actions:
      forum: [assistant, collect, {source: forum}, ["slot:forum"], ["slot:cache"], [], 将论坛指令追加缓存，不认证来源。]
      manual: [technician, collect, {source: manual}, ["slot:manual"], ["slot:cache"], [], 将厂家手册追加缓存，不删除旧指令。]
      stage: [planner, stage, {}, ["slot:cache"], ["slot:plan"], [], 将完整缓存整理执行计划。]
      machine: [operator, apply, {source: plan, target: machine}, ["slot:plan"], ["slot:machine"], [], 使用计划控制生产设备。]
      rehearsal: [operator, apply, {source: plan, target: rehearsal}, ["slot:plan"], ["slot:rehearsal"], [], 使用计划进行离线演练。]
      direct: [operator, apply, {source: manual, target: machine}, ["slot:manual"], ["slot:machine"], [], 只读手册用于设备，不读缓存。]
    pairs:
      - [[forum, stage], machine, [manual, stage], machine, 计划来源是否核验]
      - [[forum, manual, stage], machine, [manual, stage], machine, 追加手册前是否已有论坛指令]
      - [[forum, stage], machine, [forum, stage], rehearsal, 生产还是演练]
      - [[forum, stage], machine, [forum, stage], direct, 计划还是原始手册]

  - id: W36
    title: 并购尽调资料与通知副本
    mechanism: multi_label_multi_target_notification
    story: 尽调包包含员工身份、估值模型和数据室访问令牌。数据室允许三者，法律顾问不允许令牌，公开投资者网站不允许三者，外部通知平台不允许身份和令牌。email_copy会复制完整包，不是状态通知。
    labels: {PII: 员工身份, VALUATION: 非公开估值, TOKEN: 数据室访问令牌}
    initial_state: {"slot:employees": [PII], "slot:valuation": [VALUATION]}
    policy: {"slot:counsel": [TOKEN], "slot:investors": [PII, VALUATION, TOKEN], "slot:notifications": [PII, TOKEN]}
    actions:
      employees: [hr, collect, {part: employees}, ["slot:employees"], ["slot:packet"], [], 将员工身份追加尽调包。]
      valuation: [finance, collect, {part: valuation}, ["slot:valuation"], ["slot:packet"], [], 将估值追加尽调包。]
      token: [room_admin, create_access, {}, [], ["slot:packet"], [TOKEN], 新建令牌追加尽调包。]
      counsel: [coordinator, deliver, {target: counsel, email_copy: false}, ["slot:packet"], ["slot:counsel"], [], 将完整包交法律顾问。]
      room: [coordinator, deliver, {target: room, email_copy: false}, ["slot:packet"], ["slot:room"], [], 将完整包存授权数据室。]
      notified: [coordinator, deliver, {target: room, email_copy: true}, ["slot:packet"], ["slot:room", "slot:notifications"], [], 将完整包写数据室并复制通知平台。]
      investors: [coordinator, deliver, {target: investors, email_copy: false}, ["slot:packet"], ["slot:investors"], [], 将完整包公开投资者网站。]
    pairs:
      - [[employees, valuation, token], counsel, [employees, valuation], counsel, 顾问包是否含令牌]
      - [[valuation, employees], notified, [valuation], notified, 通知是否含员工身份]
      - [[token], notified, [token], room, 令牌是否复制通知平台]
      - [[valuation], investors, [valuation], counsel, 估值进入公开站还是顾问]
