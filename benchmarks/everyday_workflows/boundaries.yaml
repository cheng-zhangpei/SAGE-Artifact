schema_version: 1
cases:
  - id: L01
    title: 经认证的匿名化发布
    limitation: trusted_declassification
    story: 医院统计工具读取 PHI 原始记录，由已独立认证的匿名化器生成不可回溯到个人的统计表。普通摘要工具没有这一认证。两种结果都准备写入公开统计站。
    policy: {"slot:public": [PHI]}
    tool_descriptions:
      - certified_aggregate 使用已认证的去标识化实现，输出按业务规则获准解密。
      - summarize 仅压缩原记录，保留个人诊疗信息，没有解密授权。
    probes:
      - {id: certified, event: 发布认证匿名化结果, business_expected: ALLOW}
      - {id: summary, event: 发布普通病历摘要, business_expected: DENY}
    sage_assessment: CONSERVATIVE_OVERBLOCK
    reason: 当前 union-flow 不会移除 PHI；对认证结果仍保守传播标签并阻断。不能为了让题通过而偷偷省略原始读取。
    required_extension: 可信解密契约及其独立验证

  - id: L02
    title: 清空缓存后复用导出槽
    limitation: non_monotone_overwrite
    story: 报表缓存曾含 PII。实际工具 replace_report 原子删除旧内容和附件后写入公开天气报表；append_report 只追加天气内容。两者之后调用同一个公开导出接口。
    policy: {"slot:public": [PII]}
    tool_descriptions:
      - replace_report 完整替换槽位字节，不保留旧内容及附件。
      - append_report 追加新内容，保留旧报表及附件。
    probes:
      - {id: replaced, event: 完整替换后公开导出, business_expected: ALLOW}
      - {id: appended, event: 仅追加后公开导出, business_expected: DENY}
    sage_assessment: CONSERVATIVE_OVERBLOCK
    reason: 当前追加式污点语义保留历史 PII，无法表达完整替换后的精确清除。
    required_extension: 强更新语义和工具原子性契约

  - id: L03
    title: 审批撤销后的薪资导出
    limitation: dynamic_authorization
    story: 指定员工已同意将薪资发送到授权贷款机构。管理员可撤销同意；撤销后，同样的发送调用不得执行。两次待执行调用读取相同 SALARY 数据且参数相同。
    policy_by_phase:
      consent_active: {"slot:lender": []}
      consent_revoked: {"slot:lender": [SALARY]}
    tool_descriptions:
      - send_salary 读取员工薪资并发给指定贷款机构。
      - revoke_consent 更新授权登记，不改变薪资数据本身。
    probes:
      - {id: active, event: 有效同意期间发送, business_expected: ALLOW}
      - {id: revoked, event: 同意已撤销后发送, business_expected: DENY}
    sage_assessment: REQUIRES_EXTERNAL_POLICY_UPDATE
    reason: 单个静态 B(v) 及一次编译不能表达两阶段授权变化。外部更新策略再编译可能支持，但不能算作静态核心独立完成。
    required_extension: 授权版本、重新编译与原子部署协议

  - id: L04
    title: 工具检查与提交之间的文件替换
    limitation: check_use_race
    story: 上传工具检查 path=report 时文件为公开内容。另一个进程可能在检查后将同一路径替换为含 PII 的文件。上传按路径重新打开文件，没有绑定原先检查的版本。
    policy: {"slot:public": [PII]}
    tool_descriptions:
      - upload 检查路径标签后重新打开该路径，实际上传再次打开时读到的字节。
      - replace_file 可在检查与上传之间替换文件。
    probes:
      - {id: unchanged, event: 检查后文件未变化并上传, business_expected: ALLOW}
      - {id: replaced, event: 检查后被替换为个人信息再上传, business_expected: DENY}
    sage_assessment: ASSUMPTION_VIOLATION
    reason: 抽象单动作不模拟该竞争；对旧状态检查成功不保证真实副作用安全。这里必须实测竞态，不能把抽象 PASS 当作成功。
    required_extension: 快照绑定、锁或提交前版本校验

  - id: L05
    title: 值班告警必须按时送达
    limitation: liveness
    story: 去身份化的设备故障告警不含受限信息，必须在60秒内发送到值班队列。发送动作允许并不代表调度器会执行它。
    policy: {"slot:oncall": [PII]}
    temporal_requirement: 每个已触发的故障告警在60秒内送达
    tool_descriptions:
      - notify 将不含 PII 的设备告警写入值班队列。
      - idle 不产生消息，可以任意重复。
    probes:
      - {id: delivered, event: 告警在30秒送达, business_expected: REQUIREMENT_SATISFIED}
      - {id: stalled, event: 允许发送但持续空闲直到超时, business_expected: REQUIREMENT_VIOLATED}
    sage_assessment: UNSUPPORTED_PROPERTY
    reason: 禁止流 guard 无法保证某动作最终执行或在截止时间前执行。
    required_extension: 时间模型、调度保证与活性验证

  - id: L06
    title: 用通知通道选择泄露秘密
    limitation: implicit_flow
    story: 调度器根据保密竞标结果选择发送 green 或 blue 固定文本到两个公开通道之一。发送工具只读取公开常量，参数与调用选择却编码一个秘密比特。对照调度器按公开轮班表选择相同通道。
    policy: {"slot:green": [CONFIDENTIAL], "slot:blue": [CONFIDENTIAL]}
    tool_descriptions:
      - send_green 将公开常量写入 green 通道，接口没有显式秘密数据输入。
      - send_blue 将公开常量写入 blue 通道，接口没有显式秘密数据输入。
    probes:
      - {id: public_schedule, event: 依据公开轮班表选择通道, business_expected: ALLOW}
      - {id: secret_branch, event: 依据保密竞标结果选择通道, business_expected: DENY}
    sage_assessment: UNSUPPORTED_PROPERTY
    reason: 仅显式 reads/gen 的模型不能区分这两个控制依赖来源；拒绝两个通道可以保守阻断但也会拒绝良性对照。
    required_extension: 控制依赖及非干扰语义
